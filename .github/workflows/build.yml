name: Build Sileo Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev bzip2

      - name: Build repo
        run: |
          mkdir -p public
          cp -r debs public/debs
          cp CydiaIcon.png public/CydiaIcon.png
          cd public
          dpkg-scanpackages debs /dev/null > Packages
          gzip -k -f Packages
          bzip2 -k Packages
          cat > Release <<EOF
Origin: 蛋蛋
Label: 蛋蛋
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
Components: main
Description: My personal Sileo repo
EOF
          md5sum Packages Packages.gz Packages.bz2 > MD5SUMS
          sha256sum Packages Packages.gz Packages.bz2 > SHA256SUMS

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
