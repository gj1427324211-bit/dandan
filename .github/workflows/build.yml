name: Build Sileo Repo
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y dpkg-dev bzip2

      - name: Build repo
        run: |
          rm -rf public
          mkdir -p public/debs

          echo "===== 检查debs目录 ====="
          ls -la ./

          if [ -d "debs" ]; then
            echo "debs文件夹存在"
            ls -la debs/
            cp debs/*.deb public/debs/ || echo "没有deb包，跳过复制"
          else
            echo "警告：debs文件夹不存在！"
          fi
          
          [ -f CydiaIcon.png ] && cp CydiaIcon.png public/ || echo "CydiaIcon.png不存在，跳过"

          cd public
          
          dpkg-scanpackages -m debs /dev/null > Packages
          
          bzip2 -9 -k -f Packages
          gzip -9 -k -f Packages

          echo "Origin: 蛋蛋" > Release
          echo "Label: 蛋蛋" >> Release
          echo "Suite: stable" >> Release
          echo "Version: 1.0" >> Release
          echo "Codename: ios" >> Release
          echo "Architectures: iphoneos-arm" >> Release
          echo "Components: main" >> Release
          echo "Description: 蛋蛋个人源" >> Release
          
          echo "===== 构建完成，public目录文件 ====="
          ls -la
          ls -la debs/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
