name: Build Sileo Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg & bzip2
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2

      - name: Build repo
        run: |
          mkdir -p public
          cp -r debs public/debs
          cp CydiaIcon.png public/CydiaIcon.png
          cd public
          dpkg-scanpackages debs /dev/null > Packages
          gzip -k -f Packages
          bzip2 -k Packages
          cat > Release <<EOF
Origin: 蛋蛋
Label: 蛋蛋
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
Components: main
Description: My personal Sileo repo
EOF
        # 生成MD5、SHA256校验信息，消除Sileo警告
          md5sum Packages Packages.gz Packages.bz2 > MD5SUMS
          sha256sum Packages Packages.gz Packages.bz2 > SHA256SUMS

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
