name: Build Sileo Repo
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update && sudo apt install -y dpkg-dev bzip2
      - name: Build repo
        run: |
          rm -rf public
          mkdir -p public
          cp debs/*.deb public/debs/ 2>/dev/null || true
          [ -f CydiaIcon.png ] && cp CydiaIcon.png public/
          cd public
          dpkg-scanpackages -m . /dev/null | sed 's|^Filename: debs/|Filename: |' > Packages
          gzip -k -f Packages
          bzip2 -k Packages
          cat > apt-release.conf <<'CONF'
          APT::FTPArchive::Release::Origin "蛋蛋";
          APT::FTPArchive::Release::Label "蛋蛋";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Version "1.0";
          APT::FTPArchive::Release::Codename "ios";
          APT::FTPArchive::Release::Architectures "iphoneos-arm iphoneos-arm64 iphoneos-arm64e";
          APT::FTPArchive::Release::Components "main";
          APT::FTPArchive::Release::Description "蛋蛋个人源";
          CONF
          apt-ftparchive -c=apt-release.conf release . > Release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
