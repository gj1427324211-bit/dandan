name: Build Sileo Repo
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt update && sudo apt install -y dpkg-dev bzip2

      - name: Build repo
        run: |
          mkdir -p public
          cp -r debs public/debs
          [ -f CydiaIcon.png ] && cp CydiaIcon.png public/
          cd public
          # --multiversion 保留多版本；|| true 坏包导致扫描失败也继续执行
          dpkg-scanpackages --multiversion debs /dev/null 2>/dev/null || true
          gzip -k -f Packages
          bzip2 -k Packages
          echo "Origin: 蛋蛋" > Release
          echo "Label: 蛋蛋" >> Release
          echo "Suite: stable" >> Release
          echo "Version: 1.0" >> Release
          echo "Codename: ios" >> Release
          echo "Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e" >> Release
          echo "Components: main" >> Release
          echo "Description: 蛋蛋个人源" >> Release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
