name: Build Sileo Repo
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev bzip2

      - name: Build repository index
        run: |
          mkdir -p public
          cp -r debs public/debs
          if [ -f "CydiaIcon.png" ]; then
            cp CydiaIcon.png public/
          fi
          cd public
          dpkg-scanpackages debs /dev/null > Packages
          gzip -k -f Packages
          bzip2 -k Packages
          cat > Release <<'EOF'
Origin: 蛋蛋
Label: 蛋蛋
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
Components: main
Description: 蛋蛋个人源
EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
