name: Build Sileo Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y dpkg-dev bzip2 gzip

      - name: Build repo
        run: |
          set -e

          rm -rf public
          mkdir -p public/debs

          echo "===== 仓库根目录 ====="
          ls -la ./

          ROOTLESS_COUNT=0
          ROOTHIDE_COUNT=0

          shopt -s nullglob

          # 无根包：iphoneos-arm64，不要改 Architecture，让 Sileo/RootHide Patcher 判断转换
          if [ -d "debs/rootless" ]; then
            echo "===== 处理无根包 (iphoneos-arm64) ====="
            for f in debs/rootless/*.deb; do
              if [ -f "$f" ]; then
                if dpkg-deb --info "$f" >/dev/null 2>&1; then
                  ARCH=$(dpkg-deb -f "$f" Architecture 2>/dev/null || true)
                  echo "  ✅ $(basename "$f") | Architecture: $ARCH"
                  cp "$f" public/debs/
                  ROOTLESS_COUNT=$((ROOTLESS_COUNT + 1))
                else
                  echo "  ❌ $(basename "$f") 损坏，跳过"
                fi
              fi
            done
          else
            echo "⚠️ debs/rootless/ 不存在，跳过"
          fi

          # 隐根包：iphoneos-arm64e，直接装
          if [ -d "debs/roothide" ]; then
            echo "===== 处理隐根包 (iphoneos-arm64e) ====="
            for f in debs/roothide/*.deb; do
              if [ -f "$f" ]; then
                if dpkg-deb --info "$f" >/dev/null 2>&1; then
                  ARCH=$(dpkg-deb -f "$f" Architecture 2>/dev/null || true)
                  echo "  ✅ $(basename "$f") | Architecture: $ARCH"
                  cp "$f" public/debs/
                  ROOTHIDE_COUNT=$((ROOTHIDE_COUNT + 1))
                else
                  echo "  ❌ $(basename "$f") 损坏，跳过"
                fi
              fi
            done
          else
            echo "⚠️ debs/roothide/ 不存在，跳过"
          fi

          TOTAL=$((ROOTLESS_COUNT + ROOTHIDE_COUNT))
          echo "===== 统计：无根=$ROOTLESS_COUNT 隐根=$ROOTHIDE_COUNT 总计=$TOTAL ====="

          if [ "$TOTAL" -eq 0 ]; then
            echo "⚠️ 没有任何合法 deb 包，仍生成空 Packages/Release，避免 Pages 部署异常"
          fi

          [ -f CydiaIcon.png ] && cp CydiaIcon.png public/ || echo "CydiaIcon.png 不存在，跳过"

          cd public

          # 不篡改 Architecture！无根保持 iphoneos-arm64，隐根保持 iphoneos-arm64e
          dpkg-scanpackages -m debs /dev/null > Packages

          bzip2 -9 -k -f Packages || true
          gzip -9 -k -f Packages || true

          cat > Release <<EOF
Origin: 蛋蛋
Label: 蛋蛋
Suite: stable
Codename: ios
Architectures: iphoneos-arm64 iphoneos-arm64e
Components: main
Description: 蛋蛋个人源
EOF

          echo "===== public 目录 ====="
          ls -la
          ls -la debs/ || true

          echo "===== Release 内容 ====="
          cat Release

          echo "===== Packages 前 60 行 ====="
          head -60 Packages || true

          echo "ℹ️ 架构检查（仅供日志，不影响退出码）"
          awk '/^Package:/{p=$2} /^Architecture:/{print p": "$2}' Packages || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
