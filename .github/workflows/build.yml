name: Build Sileo Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y dpkg-dev bzip2

      - name: Build repo
        run: |
          rm -rf public
          mkdir -p public/debs

          DEB_EXIST=0
          if [ -d "debs" ]; then
            for f in debs/*.deb; do
              if [ -f "$f" ]; then
                if dpkg-deb --info "$f" >/dev/null 2>&1; then
                  echo "✅ $f 合法deb，复制"
                  cp "$f" public/debs/
                  DEB_EXIST=1
                else
                  echo "❌ $f 损坏，跳过"
                fi
              fi
            done
          fi

          [ -f CydiaIcon.png ] && cp CydiaIcon.png public/ || echo "CydiaIcon.png不存在，跳过"

          cd public

          if [ $DEB_EXIST -eq 1 ]; then
            echo "开始生成Packages索引"
            dpkg-scanpackages -m debs /dev/null > Packages
            bzip2 -9 -k -f Packages
            gzip -9 -k -f Packages

            echo "===== 修正每个包的 Architecture 为 iphoneos-arm64 ====="
            # 用 perl 逐段处理，避免 sed 多行替换的坑
            perl -i -00pe 's/^Architecture:.*$/Architecture: iphoneos-arm64/m' Packages
            # 重新压缩（包架构变了，哈希也得跟着变）
            rm -f Packages.bz2 Packages.gz
            bzip2 -9 -k -f Packages
            gzip -9 -k -f Packages

            echo "===== 生成的Packages头部 ====="
            head -20 Packages
          else
            echo "没有合法deb包，跳过Packages生成"
            touch Packages
          fi

          echo "===== 生成Release文件 ====="
          cat > Release <<EOF
Origin: 蛋蛋
Label: 蛋蛋
Suite: stable
Codename: ios
Architectures: iphoneos-arm64
Components: main
Description: 蛋蛋个人源
EOF

          if [ $DEB_EXIST -eq 1 ]; then
            {
              echo "MD5Sum:"
              for f in Packages Packages.gz Packages.bz2; do
                [ -f "$f" ] && printf ' %s %16s %s\n' "$(md5sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$f"
              done
              echo "SHA1:"
              for f in Packages Packages.gz Packages.bz2; do
                [ -f "$f" ] && printf ' %s %16s %s\n' "$(sha1sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$f"
              done
              echo "SHA256:"
              for f in Packages Packages.gz Packages.bz2; do
                [ -f "$f" ] && printf ' %s %16s %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$f"
              done
            } >> Release
          fi

          echo "===== Release内容 ====="
          cat Release
          echo "===== public目录文件 ====="
          ls -la

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
