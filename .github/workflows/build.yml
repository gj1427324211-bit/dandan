name: Build Sileo Repo
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt update && sudo apt install -y dpkg-dev bzip2

      - name: Build repo
        run: |
          mkdir -p public
          cp -r debs public/debs
          [ -f CydiaIcon.png ] && cp CydiaIcon.png public/
          cd public

          # 逐个扫描，跳过坏包，确保 Packages 至少被创建
          > Packages
          if ls debs/*.deb >/dev/null 2>&1; then
            for deb in debs/*.deb; do
              dpkg-deb -I "$deb" >/dev/null 2>&1 || { echo "⚠️ Skipping broken: $deb"; continue; }
              dpkg-scanpackages --multiversion "$deb" /dev/null >> Packages 2>/dev/null || true
            done
          fi

          # 如果 Packages 为空（0字节），写一个最小可用内容防止 Sileo 报错
          if [ ! -s Packages ]; then
            echo "# Empty repo" > Packages
          fi

          gzip -k -f Packages
          bzip2 -k Packages

          echo "Origin: 蛋蛋" > Release
          echo "Label: 蛋蛋" >> Release
          echo "Suite: stable" >> Release
          echo "Version: 1.0" >> Release
          echo "Codename: ios" >> Release
          echo "Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e" >> Release
          echo "Components: main" >> Release
          echo "Description: 蛋蛋个人源" >> Release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
