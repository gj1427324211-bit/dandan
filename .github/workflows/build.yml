name: Build Sileo Repo
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update && sudo apt install -y dpkg-dev bzip2
      - name: Build repo
        run: |
          rm -rf public
          mkdir -p public/debs
          python3 - <<'PY'
          import shutil, os
          for f in sorted(os.listdir("debs")):
              if f.endswith(".deb"):
                  shutil.copy2(os.path.join("debs", f),
                               os.path.join("public/debs", f))
          PY
          cd public
          echo "=== 文件列表 ==="
          ls -la debs/ || true
          echo "=== 逐个检查包 ==="
          for f in debs/*; do
            echo "----- $f -----"
            dpkg-deb -I "$f" 2>&1 | head -5 || true
          done
          echo "=== 尝试生成索引 ==="
          dpkg-scanpackages -m . /dev/null > Packages 2>&1
          echo "exit: $?"
          ls -la Packages || true
          wc -l Packages || true
          echo "=== Packages 内容 ==="
          head -30 Packages || true
          gzip -k -f Packages
          bzip2 -k Packages
          printf '%s\n' \
            "Origin: 蛋蛋" \
            "Label: 蛋蛋" \
            "Suite: stable" \
            "Version: 1.0" \
            "Codename: ios" \
            "Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e" \
            "Components: main" \
            "Description: 蛋蛋个人源" > Release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
