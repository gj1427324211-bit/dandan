- name: Build repo
  run: |
    rm -rf public
    mkdir -p public/debs
    python3 - <<'PY'
    import shutil, os, glob
    src = "debs"
    dst = "public/debs"
    for f in os.listdir(src):
        if f.endswith(".deb"):
            shutil.copy2(os.path.join(src, f), os.path.join(dst, f))
    print("已复制:", [f for f in os.listdir(dst)])
    PY
    [ -f CydiaIcon.png ] && cp CydiaIcon.png public/
    cd public
    dpkg-scanpackages -m debs /dev/null > Packages 2>Packages.err
    echo "=== 错误输出 ==="
    cat Packages.err || true
    echo "=== Packages 行数 ==="
    wc -l Packages || true
    echo "=== Packages 前 40 行 ==="
    head -n 40 Packages || true
    gzip -k -f Packages
    bzip2 -k Packages
    {
      echo "Origin: 蛋蛋"
      echo "Label: 蛋蛋"
      echo "Suite: stable"
      echo "Version: 1.0"
      echo "Codename: ios"
      echo "Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e"
      echo "Components: main"
      echo "Description: 蛋蛋个人源"
    } > Release
