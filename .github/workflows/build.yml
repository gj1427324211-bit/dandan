name: Build Sileo Repo
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y dpkg-dev bzip2

      - name: Build repo
        run: |
          set -e
          rm -rf public
          mkdir -p public/debs

          if [ -d debs ] && ls debs/*.deb 1> /dev/null 2>&1; then
            cp debs/*.deb public/debs/
          fi
          
          [ -f CydiaIcon.png ] && cp CydiaIcon.png public/

          cd public
          
          dpkg-scanpackages -m debs /dev/null > Packages
          
          bzip2 -9 -k -f Packages
          gzip -9 -k -f Packages

          cat > Release <<'EOF'
Origin: 蛋蛋
Label: 蛋蛋
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm
Components: main
Description: 蛋蛋个人源
EOF
          
          echo "===== 构建产物 ====="
          ls -la
          ls -la debs/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
