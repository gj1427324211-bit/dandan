name: Build Sileo Repo
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y dpkg-dev bzip2

      - name: Build repo
        run: |
          rm -rf public
          mkdir -p public/debs

          echo "===== 仓库根目录 ====="
          ls -la ./

          DEB_EXIST=0
          if [ -d "debs" ]; then
            echo "debs文件夹存在"
            ls -la debs/
            for f in debs/*.deb; do
              if [ -f "$f" ]; then
                if dpkg-deb --info "$f" >/dev/null 2>&1; then
                  echo "✅ $f 合法deb，复制"
                  cp "$f" public/debs/
                  DEB_EXIST=1
                else
                  echo "❌ $f 损坏，跳过"
                fi
              fi
            done
          else
            echo "⚠️ 仓库根目录没有debs文件夹"
          fi
          
          [ -f CydiaIcon.png ] && cp CydiaIcon.png public/ || echo "CydiaIcon.png不存在，跳过"

          cd public
          
          if [ $DEB_EXIST -eq 1 ]; then
            echo "开始生成Packages索引"
            dpkg-scanpackages -m debs /dev/null > Packages
            bzip2 -9 -k -f Packages
            gzip -9 -k -f Packages
          else
            echo "没有合法deb包，跳过Packages生成"
            touch Packages
          fi

          echo "Origin: 蛋蛋" > Release
          echo "Label: 蛋蛋" >> Release
          echo "Suite: stable" >> Release
          echo "Codename: ios" >> Release
          echo "Architectures: iphoneos-arm64" >> Release
          echo "Components: main" >> Release
          echo "Description: 蛋蛋个人源" >> Release
          
          echo "===== public目录文件 ====="
          ls -la
          ls -la debs/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
