name: Build Sileo Repo
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update && sudo apt install -y dpkg-dev bzip2
      - name: Build repo
        run: |
          set -e
          rm -rf public
          mkdir -p public/debs
          cp debs/*.deb public/debs/ 2>/dev/null || true
          [ -f CydiaIcon.png ] && cp CydiaIcon.png public/
          cd public
          dpkg-scanpackages -m debs /dev/null | \
            sed 's|^Filename: debs/|Filename: |' > Packages
          echo "=== Packages 行数 ==="
          wc -l Packages
          echo "=== Packages 前 5 行 ==="
          head -5 Packages
          gzip -9 -k -f Packages
          bzip2 -k Packages
          {
            printf 'Origin: 蛋蛋\n'
            printf 'Label: 蛋蛋\n'
            printf 'Suite: stable\n'
            printf 'Version: 1.0\n'
            printf 'Codename: ios\n'
            printf 'Architecture: iphoneos-arm\n'
            printf 'Components: main\n'
            printf 'Description: 蛋蛋个人源\n'
          } > Release
          apt-ftparchive release . | grep -E '^(MD5Sum|SHA1|SHA256|SHA512):' >> Release
          echo "=== Release 内容 ==="
          cat Release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
